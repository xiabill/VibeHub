name: Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Xcode / actool version
        run: |
          xcodebuild -version
          xcrun actool --version | head -5

      - name: Compile (unsigned)
        run: |
          swiftc -O -parse-as-library \
            -target arm64-apple-macos13.0 \
            -framework Cocoa -framework SwiftUI -framework CoreGraphics \
            -framework ServiceManagement -framework IOKit \
            -framework AVFoundation -framework CoreAudio \
            VibeHub.swift \
            -o VibeHub

      - name: Compile icon (AppIcon.icon -> Assets.car)
        run: |
          mkdir -p iconbuild
          xcrun actool AppIcon.icon \
            --compile iconbuild \
            --app-icon AppIcon \
            --include-all-app-icons \
            --enable-on-demand-resources NO \
            --development-region en \
            --target-device mac \
            --platform macosx \
            --minimum-deployment-target 13.0 \
            --output-partial-info-plist iconbuild/partial.plist \
            --output-format human-readable-text \
            --notices --warnings --errors
          echo "=== iconbuild contents ==="
          ls -la iconbuild
          echo "=== assetutil --info Assets.car ==="
          assetutil --info iconbuild/Assets.car || true

      - name: Stage artifact (binary + Assets.car)
        run: |
          mkdir -p out
          cp VibeHub out/VibeHub
          cp iconbuild/Assets.car out/Assets.car
          ls -la out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeHub-binary
          path: out
